# R.N.F. 17 – ambiente completo com um único comando: docker compose up -d
services:
  app:
    build: .
    container_name: mr-biblioteca-app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: mr-biblioteca-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: mr-biblioteca-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-biblioteca_db}
      MYSQL_USER: ${DB_USERNAME:-biblioteca}
      MYSQL_PASSWORD: ${DB_PASSWORD:-biblioteca}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Caixa de e-mail de testes: recuperação de senha e notificações de atraso
  mailpit:
    image: axllent/mailpit:latest
    container_name: mr-biblioteca-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  db-data:
